# Copy this file to `secrets.properties` (git-ignored) and fill in real values.
# These are PUBLIC client-side values, equivalent to the web app's VITE_ vars.
SUPABASE_URL=https://YOUR-PROJECT.supabase.co
SUPABASE_ANON_KEY=YOUR-PUBLISHABLE-ANON-KEY
# The Google *Web* OAuth client ID configured as the Google provider in Supabase Auth.
GOOGLE_WEB_CLIENT_ID=YOUR-WEB-OAUTH-CLIENT-ID.apps.googleusercontent.com
